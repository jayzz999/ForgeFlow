version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8001"
    env_file:
      - .env.production
    environment:
      PLATFORM_DB_PATH: /data/forgeflow_platform.db
      CHROMA_PERSIST_DIR: /data/chroma_db
    volumes:
      - forgeflow_data:/data
      - forgeflow_workflows:/app/workflows
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  forgeflow_data:
  forgeflow_workflows:
